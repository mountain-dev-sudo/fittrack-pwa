<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7657e8"><link rel="manifest" href="/manifest.webmanifest">
<title>FITTRACK — Motu & Moti</title>
<style>
:root{font-family:Inter,system-ui,Arial;background:#0b1020;color:#eef0fa}*{box-sizing:border-box}body{margin:0}header{padding:25px 18px;background:linear-gradient(120deg,#7657e8,#4932b3)}h1{margin:0;font-size:26px}header p{opacity:.9}main{max-width:900px;margin:auto;padding:18px 18px 85px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px}button,select,input{font:inherit;border:1px solid #3c4260;border-radius:11px;background:#202744;color:white;padding:10px}button{cursor:pointer}.active{background:#7657e8}section{background:#171d32;border:1px solid #2a3351;border-radius:18px;padding:18px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.metric{background:#242c49;padding:14px;border-radius:13px}.metric strong{font-size:25px;display:block;margin-top:6px}small{color:#a8b1d0}.bar{height:9px;background:#3c4260;border-radius:9px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:#9c85ff}h2{font-size:20px;margin:0 0 14px}.meal{border-top:1px solid #303754;padding:14px 0}.meal:first-of-type{border-top:0}.meal h3{margin:0 0 6px}.food{display:flex;justify-content:space-between;gap:10px;padding:5px 0;color:#d0d6ec}nav{position:fixed;bottom:0;background:#171d32;border-top:1px solid #39405a;width:100%;display:flex;justify-content:center;gap:10px;padding:10px}nav button{flex:1;max-width:180px}.error{color:#ffaaaa}#status{font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #303754}@media(max-width:450px){header{padding:20px 16px}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><header><h1>♥ FITTRACK</h1><p>Motu & Moti • Fitness & Nutrition Tracker</p></header>
<main><div class="toolbar"><button id="male" class="active" onclick="selectProfile('Male')">Motu</button><button id="female" onclick="selectProfile('Female')">Moti</button><input id="date" type="date" onchange="render()"><button onclick="sync()">↻ Sync</button><span id="status">Loading…</span></div><div id="view"></div></main>
<nav><button onclick="setPage('home')">Home</button><button onclick="setPage('meals')">Nutrition</button><button onclick="setPage('progress')">Progress</button></nav>
<script>
let data={},profile='Male',page='home';
const rows=(name)=>{const arr=data[name]||[];return arr.slice(1).map(row=>Object.fromEntries((arr[0]||[]).map((key,i)=>[key,row[i]||''])));};
const n=x=>Number(x)||0;
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function selectProfile(p){profile=p;document.getElementById('male').classList.toggle('active',p==='Male');document.getElementById('female').classList.toggle('active',p==='Female');render()}
function setPage(p){page=p;render()}
function metric(title,value,target,unit){const percent=target?Math.min(100,100*n(value)/n(target)):0;return '<div class="metric"><small>'+esc(title)+'</small><strong>'+esc(value)+' '+esc(unit)+'</strong><small>Target: '+esc(target)+' '+esc(unit)+'</small><div class="bar"><span style="width:'+percent+'%"></span></div></div>'}
function render(){if(!data.Profiles)return;const date=document.getElementById('date').value;const p=rows('Profiles').find(x=>x.Profile===profile)||{};const meals=rows('Meals').filter(x=>x.Profile===profile&&x.Date===date);const sums=rows('Daily Summary').find(x=>x.Profile===profile&&x.Date===date)||{};const goal=rows('Goals').find(x=>x.Profile===profile)||{};let out='';
if(page==='home'||page==='meals'){out+='<section><h2>'+ (profile==='Male'?'Motu':'Moti') +' — '+esc(date)+'</h2><div class="grid">'+metric('Calories',sums['Calories consumed']||0,goal.Calories||p['Calorie target']||0,'kcal')+metric('Protein',sums['Protein g']||0,goal['Protein g']||p['Protein target g']||0,'g')+metric('Carbs',sums['Carbs g']||0,goal['Carbs g']||p['Carb target g']||0,'g')+metric('Fat',sums['Fat g']||0,goal['Fat g']||p['Fat target g']||0,'g')+'</div></section>';}
if(page==='home'){out+='<section><h2>Profile</h2><div class="grid"><div class="metric"><small>Current weight</small><strong>'+esc(p['Current weight kg']||'—')+' kg</strong></div><div class="metric"><small>Body fat</small><strong>'+esc(p['Estimated body fat %']||'—')+'%</strong></div><div class="metric"><small>Height</small><strong>'+esc(p['Height cm']||'—')+' cm</strong></div></div></section>';}
if(page==='home'||page==='meals'){out+='<section><h2>Meals • '+meals.length+' foods</h2>';const groups={};meals.forEach(m=>(groups[m.Meal]??=[]).push(m));for(const [name,items] of Object.entries(groups)){out+='<div class="meal"><h3>'+esc(name)+'</h3>';for(const item of items)out+='<div class="food"><span>'+esc(item.Food)+' <small>('+esc(item.Quantity)+' '+esc(item.Unit)+')</small></span><span>'+esc(item.Calories)+' kcal</span></div>'; }out+=(meals.length?'':'<p>No meals recorded for this date.</p>')+'</section>';}
if(page==='progress'){const measurements=rows('Measurements').filter(x=>x.Profile===profile);const workouts=rows('Workouts').filter(x=>x.Profile===profile);out='<section><h2>Measurements</h2><table><tr><th>Date</th><th>Weight</th><th>Body fat</th></tr>'+measurements.map(x=>'<tr><td>'+esc(x.Date)+'</td><td>'+esc(x['Weight kg'])+' kg</td><td>'+esc(x['Body fat %'])+'%</td></tr>').join('')+'</table></section><section><h2>Workouts</h2>'+ (workouts.length?workouts.map(x=>'<div class="meal">'+esc(x.Date)+' — '+esc(x.Exercise)+'</div>').join(''):'<p>No workouts recorded yet.</p>')+'</section>';}
document.getElementById('view').innerHTML=out;}
async function sync(){const status=document.getElementById('status');status.textContent='Syncing…';try{const r=await fetch('/api/dashboard',{cache:'no-store'});const type=r.headers.get('content-type')||'';if(!type.includes('json'))throw Error('Cloudflare /api/dashboard returned HTML instead of JSON. Check Pages Functions deployment.');const obj=await r.json();if(!r.ok)throw Error(obj.error||'HTTP '+r.status);if(!Array.isArray(obj.Profiles))throw Error('Invalid dashboard response');data=obj;status.textContent='✓ Synced';render()}catch(e){status.textContent='Sync failed';document.getElementById('view').innerHTML='<section class="error"><h2>Sync failed</h2>'+esc(e.message)+'</section>';}}
document.getElementById('date').value=new Date().toLocaleDateString('en-CA');sync();if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
